<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="icon" href="../logo.jpg">
<script>window.API_URL = "https://script.google.com/macros/s/AKfycbyjvOuItNf0S4-uCAu7SS6HOAo7AkU25b2pM0uc7J4ZPGZp-Ia9Q6kWrfByIEn-9fb6/exec";</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karolinne Almeida Odontologia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Recepção digital: coluna única de conversa; a Claudinha fala acima, o cartão de ação fica abaixo. */
:root{
  --bege:#F4E9DF; --off:#FAF8F4; --nude:#D9BBA8; --caramelo:#B98258; --marrom:#765442; --dourado:#C5A575;
  --tinta:#2E2119; --suave:#5E4A3E; --branco:#FFFFFF; --ok:#3F7A55; --aviso:#A5552E;
  --titulo:"Cormorant Garamond", Georgia, serif; --texto:"Montserrat", -apple-system, "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--off);color:var(--tinta);font-family:var(--texto);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
.topo{background:var(--off);border-bottom:1px solid var(--dourado);padding:14px max(16px,env(safe-area-inset-left)) 12px;text-align:center}
.logo{width:92px;height:92px;border-radius:50%;display:block;margin:0 auto;box-shadow:0 2px 10px rgba(118,84,66,.12)}
body.compacto .logo{width:56px;height:56px}
.marca1{font-family:var(--titulo);font-weight:600;font-size:24px;letter-spacing:.08em;color:var(--marrom);line-height:1}
.marca2{font-size:10px;letter-spacing:.42em;color:var(--caramelo);font-weight:500;margin-top:4px}
.prog{display:flex;gap:4px;max-width:680px;margin:12px auto 0}
.prog span{flex:1;height:4px;border-radius:4px;background:var(--bege)}
.prog span.on{background:var(--caramelo)}
.prog-rot{font-size:12px;color:var(--suave);margin-top:6px}
main{max-width:720px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left));display:grid;gap:14px}
.fala{display:flex;gap:10px;align-items:flex-end}
.fala .av{flex:none;width:52px;height:52px}
.baloes{display:grid;gap:6px;min-width:0}
.balao{background:var(--branco);border:1px solid var(--bege);border-radius:18px 18px 18px 6px;padding:12px 16px;font-size:18px;max-width:560px;box-shadow:0 1px 0 rgba(118,84,66,.06);animation:surge .25s ease-out both}
.balao.eu{justify-self:end;background:var(--marrom);color:#FFF8F0;border-color:var(--marrom);border-radius:18px 18px 6px 18px}
.nome-av{font-size:12px;color:var(--suave);font-weight:500}
@keyframes surge{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.balao{animation:none}}
.cartao{background:var(--branco);border:1px solid var(--bege);border-radius:18px;padding:18px;display:grid;gap:14px}
h1,h2{font-family:var(--titulo);font-weight:600;color:var(--marrom);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px}h2{font-size:24px}
.cat{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--caramelo);font-weight:600}
.pergunta{font-size:19px;font-weight:500;line-height:1.4}
.opcoes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.rapidas{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:var(--texto);cursor:pointer}
.btn{min-height:50px;border-radius:14px;border:1px solid var(--marrom);background:var(--marrom);color:#FFF8F0;font-weight:600;font-size:16px;padding:12px 20px;letter-spacing:.02em}
.btn.sec{background:var(--branco);color:var(--marrom)}
.btn.leve{background:transparent;border-color:var(--nude);color:var(--suave);font-weight:500}
.btn:disabled{opacity:.45;cursor:not-allowed}
.op{min-height:54px;border-radius:14px;border:1px solid var(--nude);background:var(--off);color:var(--tinta);font-size:17px;font-weight:500;padding:12px}
.op[aria-pressed="true"]{background:var(--marrom);border-color:var(--marrom);color:#FFF8F0}
.chip{border-radius:999px;border:1px solid var(--nude);background:var(--off);padding:10px 16px;font-size:15px;color:var(--tinta);min-height:44px}
.chip[aria-pressed="true"]{background:var(--caramelo);border-color:var(--caramelo);color:#fff}
.rapida{border-radius:999px;border:1px solid var(--caramelo);background:var(--branco);color:var(--marrom);padding:12px 18px;font-size:16px;font-weight:500;min-height:46px;text-align:left}
label.campo,div.campo{display:grid;gap:6px;font-size:16px;color:var(--suave);font-weight:500}
label.campo .obr{color:var(--aviso)}
input[type=text],input[type=tel],input[type=email],input[type=date],textarea,select{width:100%;font:18px var(--texto);color:var(--tinta);background:var(--off);border:1px solid var(--nude);border-radius:12px;padding:12px 14px;min-height:50px}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:2px solid var(--caramelo);outline-offset:2px}
.grade{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.nota{font-size:14px;color:var(--suave)}
/* Tela inicial: duas escolhas grandes; o resto, discreto, logo abaixo */
.principais{display:grid;gap:12px}
.grande{display:grid;gap:2px;text-align:left;border:1.5px solid var(--marrom);background:var(--marrom);color:#FFF8F0;border-radius:18px;padding:18px 20px;min-height:76px;font-size:20px;font-weight:600;box-shadow:0 2px 10px rgba(118,84,66,.15)}
.grande small{font-size:14px;font-weight:400;opacity:.88}
.grande.claro{background:var(--branco);color:var(--marrom)}
.outros-tit{font-size:14px;color:var(--suave);margin-top:6px}
/* Data em 3 quadradinhos: dia, mês, ano */
.data3{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;max-width:340px}
.data3 input{text-align:center;font-size:22px;letter-spacing:.04em}
.data3-rot{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px;max-width:340px;font-size:13px;color:var(--suave);text-align:center}
/* Agendamento em passos */
.passo-rot{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--caramelo);font-weight:600}
.lista-grande{display:grid;gap:10px}
.dia{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--nude);background:var(--branco);color:var(--tinta);border-radius:16px;padding:16px 18px;font-size:19px;font-weight:600;min-height:64px}
.dia small{font-size:14px;font-weight:500;color:var(--suave);white-space:nowrap}
.horas{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.hora{border:1.5px solid var(--nude);background:var(--branco);color:var(--tinta);border-radius:14px;padding:14px 8px;font-size:22px;font-weight:600;min-height:60px}
.resumo{display:grid;gap:8px;font-size:18px}
.resumo b{color:var(--marrom)}
.faq{border-top:1px solid var(--bege);padding:10px 0}
body.bio .topo,body.bio .rodape{display:none}
body.bio main{padding-top:28px;padding-bottom:40px;gap:16px;max-width:520px}
.bio-cab{display:grid;justify-items:center;text-align:center;gap:6px}
.bio-cab img{width:120px;height:120px;border-radius:50%;box-shadow:0 4px 18px rgba(118,84,66,.18)}
.bio-nome{font-family:var(--titulo);font-size:36px;font-weight:600;color:var(--marrom);line-height:1.05;margin-top:6px}
.bio-sub{font-size:12px;letter-spacing:.45em;color:var(--caramelo);font-weight:600}
.bio-div{color:var(--dourado);letter-spacing:.3em;font-size:14px}
.bio-frase{color:var(--suave);font-size:16px;max-width:34ch}
.bio-icones{display:flex;gap:12px;margin-top:4px}
.bio-icones a{width:46px;height:46px;border-radius:12px;background:var(--branco);border:1px solid var(--bege);display:grid;place-items:center;color:var(--marrom);box-shadow:0 2px 8px rgba(118,84,66,.08)}
.bio-card{display:grid;grid-template-columns:64px 1fr 36px;align-items:center;gap:14px;text-decoration:none;color:var(--tinta);background:var(--branco);border:1px solid var(--bege);border-radius:22px;padding:16px 16px;box-shadow:0 4px 14px rgba(118,84,66,.08);text-align:left;font:inherit;width:100%;cursor:pointer}
.bio-card .ic{width:64px;height:64px;border-radius:50%;background:var(--off);display:grid;place-items:center;color:var(--marrom);box-shadow:inset 0 0 0 1px var(--bege)}
.bio-card b{display:block;font-family:var(--titulo);font-size:22px;letter-spacing:.06em;color:var(--marrom);font-weight:600;text-transform:uppercase}
.bio-card small{display:block;color:var(--suave);font-size:14px;line-height:1.4}
.bio-card .seta{width:36px;height:36px;border-radius:50%;background:var(--off);display:grid;place-items:center;color:var(--marrom)}
.bio-rod{text-align:center;color:var(--suave);font-size:12px;margin-top:10px}
.orient li{margin:0 0 10px;font-size:17px}
.fio-fig{background:var(--off);border:1px solid var(--bege);border-radius:16px;padding:10px}
.fio-fig svg{width:100%;height:auto;display:block}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;color:var(--marrom)}
.faq p{margin:8px 0 0}
a.grande{display:grid}
.notas{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nota-bt{border:1.5px solid var(--nude);background:var(--branco);border-radius:14px;padding:10px 4px;font-size:26px;line-height:1;color:var(--caramelo);min-height:64px;display:grid;gap:4px}
.nota-bt small{font-size:12px;color:var(--suave)}
.nota-bt[aria-pressed="true"]{background:var(--caramelo);border-color:var(--caramelo);color:#fff}
.nota-bt[aria-pressed="true"] small{color:#fff}
.erro{color:var(--aviso);font-size:14px;font-weight:500}
.caixa{background:var(--bege);border-radius:14px;padding:14px;display:grid;gap:10px}
.codigo{font-family:ui-monospace,Menlo,monospace;font-size:28px;letter-spacing:.12em;color:var(--marrom);font-weight:600;text-align:center;background:var(--bege);border-radius:12px;padding:12px}
.doc{max-height:52vh;overflow:auto;border:1px solid var(--bege);border-radius:12px;padding:4px 14px;background:var(--off)}
.doc h3{font-family:var(--texto);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--marrom);margin:14px 0 4px}
.doc p{margin:0 0 8px;font-size:15px}
.doc ul{margin:0 0 8px;padding-left:20px;font-size:15px}
.ck{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.ck input{width:26px;height:26px;flex:none;accent-color:var(--marrom);margin-top:1px}
.rev{display:grid;gap:4px;border-bottom:1px solid var(--bege);padding-bottom:10px}
.rev dt{font-size:13px;color:var(--suave)}.rev dd{margin:0 0 6px;font-weight:500}
.rev-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pend{background:#FBEDE5;border-radius:12px;padding:12px;color:var(--aviso)}
.pad{width:100%;height:190px;background:#FFFDF9;border:1.5px dashed var(--caramelo);border-radius:14px;touch-action:none;display:block}
.lista-item{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--off);border-radius:12px;padding:10px}
.horarios{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));max-height:280px;overflow:auto}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--off);border-top:1px solid var(--bege);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;justify-content:space-between;gap:10px;z-index:5}
.rodape .btn{min-height:44px;padding:8px 16px;font-size:14px}
.faixa{position:sticky;top:0;z-index:6;background:var(--aviso);color:#fff;text-align:center;padding:8px 12px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(58,42,33,.45);display:grid;place-items:center;z-index:10;padding:16px}
.modal .cartao{max-width:420px}
</style>
</head>
<body>
<div id="faixa" class="faixa" hidden>Sem conexão. Suas respostas estão guardadas neste aparelho. Tentaremos de novo.</div>
<header class="topo">
  <img id="logo" class="logo" alt="Karolinne Almeida Odontologia" hidden>
  <div id="marca-texto"><div class="marca1">KAROLINNE ALMEIDA</div><div class="marca2">ODONTOLOGIA</div></div>
  <div id="prog" hidden><div class="prog" id="prog-barras"></div><div class="prog-rot" id="prog-rot"></div></div>
</header>
<main id="app" aria-live="polite"></main>
<nav class="rodape" id="rodape">
  <button class="btn leve" id="b-voltar" type="button">← Voltar</button>
  <button class="btn sec" id="b-equipe" type="button">Falar com a equipe</button>
</nav>
<div id="modal" class="modal" hidden></div>

<script>
"use strict";
/* ---------- Ponte com o servidor ---------- */
function chamar(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, falha) {
    var erroDe = function (e) {
      var m = String((e && e.message) || e), r = /^(?:Error: )?([A-Z_]+): ([\s\S]*)$/.exec(m);
      falha(r ? { codigo: r[1], msg: r[2] } : { codigo: 'CONEXAO', msg: 'Não consegui falar com o servidor. Verifique a internet e tente de novo.' });
    };
    if (window.API_URL) {  // cópia da Claudinha fora do Google (abre dentro do Instagram): fala com o mesmo servidor por POST
      fetch(window.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: fn, args: args }) })
        .then(function (r) { return r.json(); })
        .then(function (o) { if (o && o.ok) ok(o.r); else erroDe(o && o.erro); }, function () { erroDe(''); });
      return;
    }
    google.script.run.withSuccessHandler(ok).withFailureHandler(erroDe)[fn].apply(null, args);
  });
}

/* ---------- Estado (somente neste aparelho, apagado ao encerrar) ---------- */
var G = { cfg: null, T: null, modo: 'link', convite: '', token: '', codigo: '', tela: 'inicio', pilha: [], qi: 0,
  dados: { cadastro: {}, anamnese: {}, imagem: {}, cienciaPrivacidade: false }, sig: {}, protocolo: '', voltarRevisao: false };
var CHAVE = 'ka-recepcao';
function guardarLocal() { try { if (G.token) sessionStorage.setItem(CHAVE, JSON.stringify({ token: G.token, codigo: G.codigo, tela: G.tela, qi: G.qi, dados: G.dados })); } catch (e) {} }
function limparLocal() { try { sessionStorage.removeItem(CHAVE); } catch (e) {} }
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

/* ---------- Avatar da Claudinha (ilustração própria) ---------- */
function avatar(t) {
  t = t || 52;
  return '<svg class="av" width="' + t + '" height="' + t + '" viewBox="0 0 64 64" role="img" aria-label="Claudinha, assistente virtual">' +
    '<defs><clipPath id="avc"><circle cx="32" cy="32" r="32"/></clipPath></defs><g clip-path="url(#avc)">' +
    '<rect width="64" height="64" fill="#F4E9DF"/>' +
    // cabelo (parte de trás, longo e ondulado)
    '<path d="M16 30c0-12 7-20 16.5-20S49 18 49 30c0 7 1.5 12 3.5 16 1.5 3-1 6-4 7-3 1-6-1-7-3l-19 .5c-1 2.5-4 4-7 3-3-1-5-4-3.5-7C14 42.5 16 37 16 30z" fill="#6B4532"/>' +
    // blazer bege com lapelas
    '<path d="M9 64c1-10 7-15.5 15-17.5l8 7 8-7c8 2 14 7.5 15 17.5z" fill="#C9A27E"/>' +
    '<path d="M24 46.5 32 64l-5.5-1.5L21 50z" fill="#B98258"/><path d="M40 46.5 32 64l5.5-1.5L43 50z" fill="#B98258"/>' +
    // blusa clara
    '<path d="M26 47.5 32 54l6-6.5L36 61h-8z" fill="#FAF8F4"/>' +
    // pescoço e rosto
    '<path d="M28 39h8v8.5c-2.5 2-5.5 2-8 0z" fill="#E5BFA5"/>' +
    '<ellipse cx="32" cy="29.5" rx="10" ry="12" fill="#F1D3BE"/>' +
    // franja lateral
    '<path d="M21.5 29c-.5-9 4.5-15.5 11-15.5 6 0 10.5 4.5 11 11-3.5-5-9-6.5-14-5.5-3.5.8-6.5 4-8 10z" fill="#6B4532"/>' +
    '<path d="M42.5 24c1.5 3 1.5 7 .5 11 2.5-2 3.5-6.5 2.5-10.5z" fill="#5A3A2A"/>' +
    // sobrancelhas, olhos, sorriso e blush
    '<path d="M25.5 26.3c1.5-.9 3.2-.9 4.5 0M34 26.3c1.3-.9 3-.9 4.5 0" stroke="#5A3A2A" stroke-width=".9" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="27.8" cy="29.6" rx="1.2" ry="1.4" fill="#3A2A21"/><ellipse cx="36.2" cy="29.6" rx="1.2" ry="1.4" fill="#3A2A21"/>' +
    '<circle cx="28.2" cy="29.1" r=".35" fill="#fff"/><circle cx="36.6" cy="29.1" r=".35" fill="#fff"/>' +
    '<path d="M28.6 35.2c2 1.7 4.8 1.7 6.8 0" stroke="#B5675A" stroke-width="1.3" fill="none" stroke-linecap="round"/>' +
    '<circle cx="25" cy="33.2" r="1.7" fill="#E9A99A" opacity=".45"/><circle cx="39" cy="33.2" r="1.7" fill="#E9A99A" opacity=".45"/>' +
    // brinco dourado discreto
    '<circle cx="21.8" cy="33.8" r=".9" fill="#C5A575"/>' +
    '</g></svg>';
}
function fala(msgs) {
  msgs = [].concat(msgs);
  return '<div class="fala">' + avatar() + '<div class="baloes"><span class="nome-av">Claudinha · assistente virtual</span>' +
    msgs.map(function (m) { return '<div class="balao">' + m + '</div>'; }).join('') + '</div></div>';
}
function minhaFala(t) { return '<div class="balao eu">' + esc(t) + '</div>'; }

/* ---------- Progresso ---------- */
var ETAPAS = [['identificacao', 'Identificação'], ['anamnese', 'Saúde'], ['revisao', 'Revisão'], ['documentos', 'Documentos'], ['assinatura', 'Assinatura']];
function progresso() {
  var i = ETAPAS.map(function (e) { return e[0]; }).indexOf(G.tela);
  $('#prog').hidden = i < 0;
  document.body.classList.toggle('compacto', i >= 0);
  if (i < 0) return;
  $('#prog-barras').innerHTML = ETAPAS.map(function (e, k) { return '<span class="' + (k <= i ? 'on' : '') + '"></span>'; }).join('');
  $('#prog-rot').textContent = 'Etapa ' + (i + 1) + ' de ' + ETAPAS.length + ' · ' + ETAPAS[i][1];
}

/* ---------- Navegação ---------- */
function ir(tela, semPilha) {
  if (!semPilha && G.tela !== tela) G.pilha.push(G.tela);
  G.tela = tela; render(); window.scrollTo(0, 0); guardarLocal(); salvarAuto();
}
$('#b-voltar').addEventListener('click', function () {
  if (G.tela === 'anamnese' && G.qi > 0) { G.qi--; render(); return; }
  if (G.tela === 'final') return;
  var t = G.pilha.pop(); if (t) { G.tela = t; render(); window.scrollTo(0, 0); }
});
$('#b-equipe').addEventListener('click', function () { ir('equipe'); });

/* ---------- Telas ---------- */
var TELAS = {};
function render() {
  progresso();
  $('#b-voltar').style.visibility = (G.tela === 'inicio' || G.tela === 'final') ? 'hidden' : 'visible';
  document.body.classList.toggle('bio', G.tela === 'clinica');
  $('#app').innerHTML = TELAS[G.tela]();
  if (TELAS[G.tela].depois) TELAS[G.tela].depois();
}
function mostrarErro(e, alvo) {
  var el = alvo ? $(alvo) : null, msg = esc(e.msg || 'Algo deu errado. Tente de novo.');
  if (e.codigo === 'CONEXAO') $('#faixa').hidden = false;
  if (el) el.innerHTML = '<p class="erro">' + msg + '</p>'; else $('#app').insertAdjacentHTML('afterbegin', fala('<span class="erro">' + msg + '</span>'));
}

TELAS.carregando = function () { return fala('Só um instante…'); };

TELAS.inicio = function () {
  var T = G.T.mensagens, ipad = G.modo === 'ipad';
  var grandes = (ipad ? [['novo', 'Fazer meu cadastro', 'Ficha e informações de saúde, com segurança'], ['agendar', 'Agendar consulta', 'Escolha o dia e o horário']]

function partesHorario(iso) {
  var d = new Date(iso), f = function (o) { return new Intl.DateTimeFormat('pt-BR', Object.assign({ timeZone: 'America/Sao_Paulo' }, o)).format(d); };
  return { dia: f({ year: 'numeric', month: '2-digit', day: '2-digit' }), diaNum: f({ day: 'numeric' }), mes: MESES[Number(f({ month: 'numeric' })) - 1], hora: f({ hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }) };
}
function fmtTel(t) { var d = String(t || '').replace(/\D/g, ''); return d.length === 11 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7) : d.length === 10 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6) : t; }

TELAS.agendar = function () {
  G.ag = { hs: null };
  return fala('Vamos marcar sua consulta. É rapidinho: uma pergunta de cada vez.') + '<div class="cartao">' + passo(1, 5, 'Qual sexta-feira é melhor para você?') + '<div id="dias" class="lista-grande"><span class="nota">Carregando a agenda…</span></div>' +
    '<button class="btn leve" type="button" id="nenhum">Nenhum dia serve: entrar na lista de espera</button></div>';
};
TELAS.agendar.depois = function () {
  $('#nenhum').onclick = function () { ir('espera'); };
  chamar('apiHorarios').then(function (hs) {
    G.ag.hs = hs; var dias = [];
    hs.forEach(function (h) { var p = partesHorario(h.inicio); var d = dias.filter(function (x) { return x.dia === p.dia; })[0]; if (!d) dias.push(d = { dia: p.dia, rot: 'Sexta, ' + p.diaNum + ' de ' + p.mes, n: 0 }); d.n++; });
    $('#dias').innerHTML = dias.length ? dias.slice(0, 4).map(function (d) { return '<button class="dia" type="button" data-dia="' + esc(d.dia) + '">' + esc(d.rot) + '<small>' + d.n + (d.n === 1 ? ' horário livre' : ' horários livres') + '</small></button>'; }).join('')
      : '<p>Não há horários livres nas próximas semanas. Toque em <b>Falar com a equipe</b> que combinamos com você.</p>';
    document.querySelectorAll('[data-dia]').forEach(function (b) { b.onclick = function () { G.ag.dia = b.dataset.dia; G.ag.diaRot = b.childNodes[0].textContent; ir('agHora'); }; });
  }).catch(function () { $('#dias').innerHTML = '<p class="erro">Não consegui carregar a agenda agora. Tente de novo em instantes ou fale com a equipe.</p>'; });
};
TELAS.agHora = function () {
  var hs = (G.ag.hs || []).filter(function (h) { return partesHorario(h.inicio).dia === G.ag.dia; });
  return '<div class="cartao">' + passo(2, 5, 'Qual horário?') + '<p>' + esc(G.ag.diaRot) + '</p><div class="horas">' +
    hs.map(function (h) { return '<button class="hora" type="button" data-h="' + esc(h.inicio) + '">' + esc(partesHorario(h.inicio).hora) + '</button>'; }).join('') + '</div></div>';
};

  if (!G.token || ['identificacao', 'anamnese', 'revisao', 'documentos', 'assinatura'].indexOf(G.tela) < 0) return;
  clearTimeout(salvarTimer);
  salvarTimer = setTimeout(function () {
    chamar('apiSalvar', G.token, G.tela, G.dados).then(function () { $('#faixa').hidden = true; }).catch(function (e) {
      if (e.codigo === 'CONEXAO') $('#faixa').hidden = false;
      else if (e.codigo === 'SESSAO_EXPIRADA' || e.codigo === 'SESSAO_INVALIDA') { limparLocal(); G.token = ''; $('#app').innerHTML = fala(esc(e.msg)) + '<button class="btn" type="button" id="vi">Começar de novo</button>'; $('#vi').onclick = reiniciar; }
    });
  }, 1200);
}
window.addEventListener('online', function () { $('#faixa').hidden = true; salvarAuto(); });
window.addEventListener('offline', function () { $('#faixa').hidden = false; });

/* ---------- iPad da recepção: encerramento por inatividade ---------- */
var inativo = null;
function vigiar() {
  if (G.modo !== 'ipad') return;
  clearTimeout(inativo);
  inativo = setTimeout(function () {
    if (G.tela === 'inicio') return;
    $('#modal').innerHTML = '<div class="cartao">' + fala('Ainda está aí? Para proteger seus dados, vou encerrar esta sessão em 60 segundos.') + '<button class="btn" type="button" id="sigo">Continuar preenchendo</button></div>';
    $('#modal').hidden = false;
    var fim = setTimeout(reiniciar, 60000);
    $('#sigo').onclick = function () { clearTimeout(fim); $('#modal').hidden = true; vigiar(); };
  }, 8 * 60000);
}
['pointerdown', 'keydown'].forEach(function (ev) { document.addEventListener(ev, vigiar, { passive: true }); });

/* ---------- Início ---------- */
G.tela = 'carregando'; render();
function lerLocal(cb) {
  if (window.API_URL) { var q = {}; new URLSearchParams(location.search).forEach(function (v, k) { q[k] = v; }); return cb({ parameter: q }); }
  google.script.url.getLocation(cb);
}
lerLocal(function (loc) {
  var p = (loc && loc.parameter) || {};
  G.modo = p.modo === 'ipad' ? 'ipad' : 'link';
  G.convite = p.convite || ''; G.orientT = p.t || '';
  chamar('apiConfig').then(function (cfg) {
    G.cfg = cfg; G.T = cfg.textos;
    if (cfg.logo) { $('#logo').src = cfg.logo; $('#logo').hidden = false; $('#marca-texto').hidden = true; }
    var salvo = null; try { salvo = JSON.parse(sessionStorage.getItem(CHAVE) || 'null'); } catch (e) {}
    if (p.assinar) {
      chamar('apiTratamentoAbrir', p.assinar).then(function (t) {
        G.trat = { token: p.assinar, docs: t.docs, campos: t.campos, plano: t.plano || [], resp: {}, ass: {}, i: 0, signatario: t.paciente.nome };
        G.tela = 'tratamento'; render();
      }).catch(function (e) { $('#app').innerHTML = fala('<span class="erro">' + esc(e.msg) + '</span>'); });
      vigiar(); return;
    }
    // Atalhos do link (?ir=agendar, consulta, documentos, info, equipe, novo): abrem direto a tela certa; "Voltar" leva ao menu.
    var ATALHOS = { orientacoes: 'orientacoes', clinica: 'clinica', google: 'google', pesquisa: 'pesquisa', espera: 'espera', agendar: 'agendar', consulta: 'minhaConsulta', documentos: 'documentosMenu', info: 'info', equipe: 'equipe', novo: 'boasvindas' };
    var alvo = !G.convite && ATALHOS[p.ir];
    if (salvo && salvo.token) { G.token = salvo.token; G.codigo = salvo.codigo; G.dados = salvo.dados; G.qi = salvo.qi || 0; G.tela = salvo.tela || 'identificacao'; }
    if (alvo && !(p.ir === 'documentos' && G.token)) { G.pilha = ['inicio']; G.tela = alvo; }
    else if (!(salvo && salvo.token)) G.tela = G.convite ? 'boasvindas' : 'inicio';
    render();
    vigiar();
  }).catch(function (e) { $('#app').innerHTML = fala('<span class="erro">' + esc(e.msg) + '</span>'); });
});
</script>
</body>
</html>
